---
# ==========================================================================
# JANJIARA — aturan deploy cPanel (Git Version Control)
# --------------------------------------------------------------------------
# Dipakai tombol "Deploy HEAD Commit" di cPanel » Git Version Control.
#
# Alur kerja setiap ada perubahan:
#   1. laptop : git push
#   2. cPanel : Git Version Control  ->  Update from Remote
#   3. cPanel : Deploy HEAD Commit
#
# Hanya berkas yang memang disajikan web yang disalin ke document root.
# .git/, tema-src/, _arsip/, tools/, .github/ dan dokumentasi TIDAK ikut.
#
# JIKA DOCUMENT ROOT BERPINDAH, ubah satu baris DEPLOYPATH di bawah.
# Jalurnya bisa dilihat di cPanel » Domains, kolom Document Root.
# ==========================================================================
deployment:
  tasks:
    # Document root janjiara.com. Ditulis sebagai jalur mutlak, BUKAN
    # "$HOME/public_html": di lingkungan deploy cPanel $HOME tidak selalu
    # terisi, dan bila kosong jalurnya berubah menjadi "/public_html" —
    # folder yang sama sekali lain.
    - export DEPLOYPATH=/home/jank1853/public_html

    # Document root WAJIB sudah ada — cPanel yang membuatnya saat domain
    # didaftarkan. Jadi di sini hanya diperiksa, TIDAK dibuat.
    #
    # Dulu baris ini "mkdir -p $DEPLOYPATH". Itu berbahaya: kalau DEPLOYPATH
    # salah, mkdir justru MEMBUAT folder itu, semua perintah copy di bawah
    # sukses, log deploy bersih — padahal web menyajikan folder lain dan
    # situsnya tetap 404. Persis gejala yang sulit dilacak itu.
    # Dengan test -d, DEPLOYPATH yang salah langsung menggagalkan deploy.
    - test -d "$DEPLOYPATH"
    - echo "Document root ditemukan:" "$DEPLOYPATH"

    # --- bersihkan sisa situs lama ---------------------------------------
    # KOREKSI (22 Okt 2026): komentar di sini sebelumnya menuduh .htaccess
    # situs statis lama sebagai penyebab janjiara.com selalu 404. ITU SALAH.
    # Penyebab sebenarnya: ada deploy aplikasi Node.js (category: static,
    # node:22, "serving the files as-is") yang terpasang untuk domain ini
    # dan merebut SELURUH permintaan, sehingga Apache, .htaccess dan PHP
    # tidak pernah kebagian. Buktinya: halaman 404 yang sama persis
    # (utf-8, 1641 B) dibalas untuk semua jalur termasuk /cgi-bin/ dan
    # /.well-known/, untuk semua metode (GET/POST/PUT/OPTIONS), dan
    # /index.html dibelokkan ke /index -- itu "clean URLs" bawaan static
    # server Node, bukan aturan .htaccess.
    #
    # Deploy ini TIDAK akan menyelesaikan 404 selama aplikasi Node.js itu
    # masih aktif. Matikan/hapus dulu dari panel hosting, baru deploy.
    # Lihat bagian "Hosting: PHP via cPanel, BUKAN Node.js" di README.md.
    #
    # Perintah rm di bawah tetap berguna: menyingkirkan berkas bentrok yang
    # mungkin tertinggal di document root dari percobaan sebelumnya.
    # cgi-bin/ dan .well-known/
    # (dipakai AutoSSL untuk memperbarui sertifikat) sengaja TIDAK disentuh,
    # begitu juga subfolder lain milik Anda.
    - /bin/rm -f "$DEPLOYPATH/.htaccess" "$DEPLOYPATH/index.html" "$DEPLOYPATH/index.htm" "$DEPLOYPATH/index.php" "$DEPLOYPATH/404.html" "$DEPLOYPATH/403.html" "$DEPLOYPATH/500.html"

    # --- halaman + pengaturan server -------------------------------------
    - /bin/cp -f index.php index.html .htaccess "$DEPLOYPATH/"

    # --- aset: gambar tema, video ucapan, poster, logo, QRIS -------------
    - /bin/cp -Rf tema video brand assets "$DEPLOYPATH/"

    # --- penanda versi yang sedang tayang ---------------------------------
    # Menulis commit yang baru saja dideploy ke sebuah berkas teks kecil di
    # document root. Gunanya: dari luar, tanpa akses apa pun ke server, bisa
    # langsung dicek versi mana yang benar-benar tayang —
    #   curl https://janjiara.com/assets/deploy-check.txt
    # Tanpa ini, perubahan yang tidak kelihatan di halaman (misalnya hanya
    # menyentuh tools/ atau README) mustahil diverifikasi dari luar.
    # "|| echo" dipasang supaya deploy tidak ikut gagal kalau git tidak ada.
    - /bin/sh -c "git rev-parse HEAD 2>/dev/null || echo tidak-diketahui" > "$DEPLOYPATH/assets/deploy-check.txt"
    - /bin/date -u "+%Y-%m-%d %H:%M:%S UTC" >> "$DEPLOYPATH/assets/deploy-check.txt"

    # --- izin baca untuk Apache ------------------------------------------
    # Folder 700 / berkas 600 membuat Apache membalas 403 (penyebab QRIS
    # tidak tampil sebelumnya). Mode simbolik "u+rwX,go+rX,go-w" memberi
    # 755 untuk folder dan 644 untuk berkas dalam satu perintah.
    - /bin/chmod 644 "$DEPLOYPATH/index.php" "$DEPLOYPATH/index.html" "$DEPLOYPATH/.htaccess"
    - /bin/chmod -R u+rwX,go+rX,go-w "$DEPLOYPATH/tema" "$DEPLOYPATH/video" "$DEPLOYPATH/brand" "$DEPLOYPATH/assets"

    # --- pemeriksaan hasil ------------------------------------------------
    # Bila salah satu berkas kunci tidak sampai, deploy ditandai GAGAL di log
    # cPanel. Lebih baik ketahuan di sini daripada baru sadar saat membuka
    # situsnya dan menemukan 404 lagi.
    - test -f "$DEPLOYPATH/index.php"
    - test -f "$DEPLOYPATH/.htaccess"
    - test -f "$DEPLOYPATH/tema/adat-jawa.webp"
    - test -f "$DEPLOYPATH/assets/qris-shopeepay.png"
    - test -s "$DEPLOYPATH/assets/deploy-check.txt"
    - test -f "$DEPLOYPATH/assets/pay/bca.webp"
    - test -f "$DEPLOYPATH/video/poster/natal-tahun-baru-001.webp"
    - echo "Deploy JANJIARA selesai. Document root:" "$DEPLOYPATH"
